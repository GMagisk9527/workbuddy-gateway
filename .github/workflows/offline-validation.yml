name: Offline Go validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
