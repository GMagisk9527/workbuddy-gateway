name: Offline Go validation

on:
  pull_request:
    paths:
      - '*.go'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/offline-validation.yml'
  push:
    branches: [main]
    paths:
      - '*.go'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/offline-validation.yml'

permissions:
  contents: read

jobs:
  offline-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Check JSON fallback on the same toolchain
        env:
          GOEXPERIMENT: nojsonv2
        run: go test -run 'TestModelRequest|TestDecodeModelRequest|FuzzRequestJSONNumbersParity' ./...
      - run: go test -race ./...
